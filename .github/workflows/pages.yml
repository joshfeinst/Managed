name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # A no-op once Pages is on. It cannot turn Pages ON by itself: creating
          # a Pages site needs admin rights the workflow's GITHUB_TOKEN does not
          # have, so with Pages off this step fails "Resource not accessible by
          # integration" no matter what permissions are declared above. Enable it
          # once by hand: Settings -> Pages -> Source: GitHub Actions.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
